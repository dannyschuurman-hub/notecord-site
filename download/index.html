<style>
body{background:var(--paper);color:var(--paper-ink)}
.vp h1,.vp h2{isolation:isolate}
.vp mark{position:relative;z-index:-1}
.vp-bar{display:flex;align-items:center;justify-content:space-between;padding:22px var(--gut);max-width:1240px;margin:auto}
.vp-merk{padding-block:10px;margin-block:-10px;display:flex;align-items:center;gap:.4em;font:600 var(--t-lead)/1 var(--merk);letter-spacing:-.03em;color:var(--paper-ink);text-decoration:none}
.vp-merk svg{width:1.05em;height:1em}
.vp-bar nav a{display:inline-block;padding-block:13px;font-size:var(--t-small);color:var(--paper-mist);text-decoration:none}
.vp-bar nav a:hover{color:var(--paper-ink)}
.vp-held{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(32px,6vw,96px);align-items:center;max-width:1240px;margin:auto;padding:clamp(32px,6svh,80px) var(--gut) clamp(64px,12svh,140px)}
.vp-held h1{font-size:var(--t-h2);line-height:1.1;letter-spacing:-.028em;text-wrap:balance}
.vp-held .lead{margin-top:24px;max-width:31em;color:#2A2732}
.vp-knop{display:inline-flex;align-items:center;height:52px;padding:0 26px;margin-top:34px;border-radius:99px;background:var(--ink);color:var(--ivory);font:600 var(--t-body)/1 var(--sans);text-decoration:none;transition:transform .25s var(--ease),background .25s var(--ease)}
.vp-knop:hover{background:#1f1c29}
.vp-knop:active{transform:scale(.97)}
.vp-foon{display:flex;justify-content:center}
.vp-foon .iphone{position:relative;--pw:min(58svh,360px);flex:none;box-shadow:inset 0 0 0 calc(var(--u)*.7) rgba(255,255,255,.3),0 calc(var(--u)*40) calc(var(--u)*90) calc(var(--u)*-30) rgba(11,10,18,.34)}
.vp-moment{max-width:1240px;margin:auto;padding:0 var(--gut) clamp(72px,14svh,160px)}
.vp-moment figure{margin:0 0 clamp(32px,6svh,64px)}
.vp-moment img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:20px;background:var(--ink)}
.vp-moment .tekst{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,80px);align-items:start}
.vp-moment h2{font-size:var(--t-h2);line-height:1.1;letter-spacing:-.028em;text-wrap:balance}
.vp-moment p{font-size:var(--t-lead);line-height:1.4;color:#2A2732;max-width:30em;text-wrap:pretty}
.vp-delen{max-width:1240px;margin:auto;padding:0 var(--gut) clamp(72px,14svh,160px);display:grid;gap:clamp(40px,7svh,72px)}
.vp-delen section{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,5vw,80px);padding-top:28px;border-top:1px solid rgba(11,10,18,.12)}
.vp-delen h2{font-size:var(--t-h3);line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.vp-delen h2::before{content:"";display:block;width:10px;height:10px;border-radius:50%;background:var(--rose);margin-bottom:16px}
.vp-delen p{max-width:34em;color:#2A2732;font-size:var(--t-lead);line-height:1.4;text-wrap:pretty}
.vp-vragen{background:#F3F3F2;padding:clamp(72px,14svh,160px) var(--gut)}
.vp-vragen>div{max-width:1240px;margin:auto;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,6vw,96px)}
.vp-vragen h2{font-size:var(--t-h2);line-height:1.1;letter-spacing:-.028em;position:sticky;top:48px;align-self:start;text-wrap:balance}
.vp-vragen dl{border-top:1px solid rgba(11,10,18,.12)}
.vp-vragen dt{font:800 var(--t-lead)/1.25 var(--display);letter-spacing:-.01em;padding-top:26px}
.vp-vragen dd{margin:10px 0 0;padding-bottom:26px;border-bottom:1px solid rgba(11,10,18,.12);color:#2A2732;max-width:38em}
.vp-slot{background:var(--ink);color:var(--ivory);text-align:center;padding:clamp(96px,18svh,200px) var(--gut) clamp(72px,12svh,120px)}
.vp-slot h2{font-size:var(--t-h2);line-height:1.1;letter-spacing:-.028em;max-width:12em;margin:auto;text-wrap:balance}
.vp-slot p{margin:22px auto 0;max-width:30em;color:#C9C3D0;font-size:var(--t-lead);line-height:1.4}
.vp-slot .vp-knop{background:var(--rose);color:var(--ink)}
.vp-slot .vp-knop:hover{background:#f3a8dc}
.vp-slot .appstore{display:inline-block;margin-top:34px;border-radius:10px}
.vp-slot .appstore img{display:block;height:54px;width:auto}
.vp-voet{background:var(--ink);color:#9C95A6;font-size:var(--t-small);padding:0 var(--gut) 44px;text-align:center}
.vp-voet p+p{margin-top:8px}
.vp-voet a{color:inherit;display:inline-block;padding-block:12px;margin-block:-12px}
@keyframes vp-rijs{from{opacity:0;transform:translateY(24px)}}
@media (prefers-reduced-motion:no-preference){
 .vp-held>div:first-child{animation:vp-rijs .8s var(--ease) both}
 .vp-foon{animation:vp-rijs .9s .12s var(--ease) both}
 @supports (animation-timeline:view()){
  .vp-moment figure,.vp-moment .tekst,.vp-delen section,.vp-vragen dt,.vp-vragen dd{animation:vp-rijs linear both;animation-timeline:view();animation-range:entry 0% entry 40%}
 }
}
@media (max-width:820px){
 .vp-held{grid-template-columns:1fr;padding-top:16px}
 .vp-foon .iphone{--pw:min(64vw,260px)}
 .vp-moment .tekst,.vp-delen section,.vp-vragen>div{grid-template-columns:1fr}
 .vp-moment img{border-radius:14px}
 .vp-vragen h2{position:static}
 .vp-slot h2{max-width:none}
}
@media (prefers-reduced-motion:reduce){.vp-knop{transition:none}}
body.vp{min-height:100svh}.vp-dl{min-height:calc(100svh - 110px);display:flex;align-items:center}.vp-dl .vp-held{grid-template-columns:1fr}.vp-dl .dl-knoppen{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;margin-top:30px}.vp-dl .dl-knoppen .vp-knop{margin:0;height:auto;min-height:52px;padding:14px 26px;line-height:1.2}.vp-dl .terug{color:inherit}</style>
